<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Psychrometric Frequency Chart — Synthetic Demo</title>
  <style>
    :root {
      --primary-text-color:#e7e7e7; --secondary-text-color:#a8a8a8;
      --card-background-color:#1c1c1c; --secondary-background-color:#292929;
      --divider-color:#3a3a3a; --primary-color:#03a9d9; --error-color:#ef5350;
    }
    * { box-sizing:border-box; }
    body { margin:0; background:#111; color:var(--primary-text-color);
      font-family:Roboto,Arial,sans-serif; }
    .demo-banner { padding:9px 16px; background:#263238; color:#b2ebf2;
      font-size:13px; text-align:center; letter-spacing:.2px; }
    psychrometric-chart-card { display:block; max-width:1200px; margin:0 auto; }
  </style>
</head>
<body>
  <div class="demo-banner">Synthetic demonstration data — no household sensor history</div>
  <psychrometric-chart-card id="chart"></psychrometric-chart-card>
  <script type="module" src="./psychrometric-chart-card.js"></script>
  <script type="module">
    // Deterministic fake recorder data keeps public screenshots reproducible
    // and prevents real Home Assistant telemetry from entering the repository.
    const series = [
      ["Outside air", "demo_outside", "#f44336"],
      ["Bathroom", "demo_bathroom", "#e91e63"],
      ["Bay window seat", "demo_baywindow", "#6d4c41"],
      ["Ensuite", "demo_ensuite", "#9c27b0"],
      ["Hallway", "demo_hallway", "#ff9800"],
      ["Kitchen", "demo_kitchen", "#009688"],
      ["Living room", "demo_living", "#4caf50"],
      ["Master bedroom", "demo_master", "#3f51b5"],
      ["Small bedroom", "demo_small", "#2196f3"],
    ].map(([name, slug, color], index) => ({
      name,
      temperature: `sensor.${slug}_temperature`,
      humidity: `sensor.${slug}_humidity`,
      color,
      default_visible: index === 0 || index >= 3,
    }));

    const states = {};
    series.forEach((item, index) => {
      states[item.temperature] = { state: String(9 + index * 1.7) };
      states[item.humidity] = { state: String(72 - index * 3) };
    });

    function syntheticStatistics(message) {
      const result = {};
      const start = new Date(message.start_time).getTime();
      const end = new Date(message.end_time).getTime();
      const step = message.period === "5minute" ? 300000 : 3600000;
      const wanted = new Set(message.statistic_ids);
      series.forEach((item, seriesIndex) => {
        const temperatures = [];
        const humidities = [];
        for (let time = start, point = 0; time <= end; time += step, point += 1) {
          const daily = Math.sin((point % (24 * 12)) / (24 * 12) * Math.PI * 2);
          const slower = Math.sin(point / (24 * 12 * 5) * Math.PI * 2 + seriesIndex * .45);
          const temperature = 8 + seriesIndex * 1.65 + 5.5 * slower + 1.6 * daily;
          const humidity = Math.max(28, Math.min(94,
            70 - seriesIndex * 2.4 - 13 * slower - 4 * daily));
          temperatures.push({ start: time, mean: temperature });
          humidities.push({ start: time, mean: humidity });
        }
        if (wanted.has(item.temperature)) result[item.temperature] = temperatures;
        if (wanted.has(item.humidity)) result[item.humidity] = humidities;
      });
      return result;
    }

    const hass = {
      states,
      callWS: async (message) => {
        if (message.type === "recorder/statistics_during_period") {
          return syntheticStatistics(message);
        }
        if (message.type === "frontend/get_user_data") return { value: null };
        return true;
      },
    };

    const chart = document.querySelector("#chart");
    chart.setConfig({
      title: "Psychrometric frequency — synthetic demo",
      default_range: "1m",
      default_colour_mode: "sensor",
      altitude: 0,
      sea_level_pressure: 101.325,
      humidity_ratio_reference_temperature: 20,
      min_temperature: -10,
      max_temperature: 40,
      max_absolute_humidity: 25,
      temperature_bin: .5,
      absolute_humidity_bin: .25,
      series,
    });
    chart.hass = hass;
  </script>
</body>
</html>
